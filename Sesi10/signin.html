<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSchool - Sign In</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>SIGN IN</h2>
        <p>Welcome to WebSchool</p>
    
    <form>
        <!--email-->
        <div class="input-group">
        <label>Email</label>
        <input type="email" id="email" required placeholder="enter your email">
        <small id="emailError" style="display:none; color:red;">
            Email must be @sekolahchis.com
        </small>
        </div>

        <!--password-->
        <div class="input-group">
            <label>Password</label>
            <div class="password-wrapper">
                <input type="password" id="password" placeholder="enter your password">
                <img src="./assets/hide.png" alt="showpw" class="eye-icon">
            </div>
        </div>
    


        <!--button submit-->
        <button type="submit">Login</button>

        <!--go sign in-->
        <div class="small-text">
            Don't have account? <a href="signup.html">Sign up here</a>
        </div>

    </form>
    </div>
    <script>
        const form = document.querySelector("form");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const emailError = document.getElementById("emailError");
        const submitBtn = document.querySelector("button");
        const eyeIcons = document.querySelectorAll(".eye-icon");

        const schoolEmailPattern = /^[a-z0-9._%+-]+@sekolahchis\.com$/;

        /* =========================
        1. Show / Hide Password
        ========================== */
        eyeIcons.forEach(icon => {
            icon.addEventListener("click", () => {
                const input = icon.previousElementSibling;
                input.type = input.type === "password" ? "text" : "password";
                icon.src = input.type === "password"
                    ? "./assets/hide.png"
                    : "./assets/view.png";
            });
        });

        /* =========================
        2. Live Email Validation
        ========================== */
        emailInput.addEventListener("input", () => {
            const emailValue = emailInput.value.trim().toLowerCase();

            if (!schoolEmailPattern.test(emailValue)) {
                emailError.style.display = "block";
                submitBtn.disabled = true;
            } else {
                emailError.style.display = "none";
                submitBtn.disabled = false;
            }
        });

        /* =========================
        3. Submit + Redirect
        ========================== */
        form.addEventListener("submit", (e) => {
            e.preventDefault();

            const emailValue = emailInput.value.trim().toLowerCase();

            if (!schoolEmailPattern.test(emailValue)) {
                emailError.style.display = "block";
                return;
            }

            // SUCCESS
            alert("Login success 🎉");

            // redirect after 1 second
            setTimeout(() => {
                window.location.href = "registration.html"; 
            }, 1000);
        });
    </script>
</body>
</html>
