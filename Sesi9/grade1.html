    <!-- the content: -->
        <header>
            <h1>My Portfolio</h1>
        </header>

    <div class="container" id="about">
        <h4>Grade 1</h4>

    <!-- Full-width images with number text -->
        <div class="mySlides">
            <div class="numbertext">1 / 2</div>
            <img src="./assets/Grade1/Bebras.jpg">
        </div>

        <div class="mySlides">
            <div class="numbertext">2 / 2</div>
            <img src="./assets/Grade1/rank.jpg">
        </div>

    <!-- Next and previous buttons -->
        <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
        <a class="next" onclick="plusSlides(1)">&#10095;</a>

    <!-- Image text -->
        <div class="caption-container">
        <p id="caption"></p>
        </div>

    <!-- Thumbnail images -->
        <div class="row">
            <div class="column">
            <img class="demo cursor" src="./assets/Grade1/Bebras.jpg" onclick="currentSlide(1)" alt="Bebras">
        </div>
        <div class="column">
            <img class="demo cursor" src="./assets/Grade1/rank.jpg" onclick="currentSlide(2)" alt="Semester 1">
        </div>
        </div>
    </div>

    <script>
        let slideIndex = 1;
        showSlides(slideIndex);

    // Next/previous controls
        function plusSlides(n) {
        showSlides(slideIndex += n);
        }

    // Thumbnail image controls
        function currentSlide(n) {
        showSlides(slideIndex = n);
        }

        function showSlides(n) {
        let i;
        let slides = document.getElementsByClassName("mySlides");
        let dots = document.getElementsByClassName("demo");
        let captionText = document.getElementById("caption");
        if (n > slides.length) {slideIndex = 1}
        if (n < 1) {slideIndex = slides.length}
        for (i = 0; i < slides.length; i++) {
            slides[i].style.display = "none";
        }
        for (i = 0; i < dots.length; i++) {
            dots[i].className = dots[i].className.replace(" active", "");
        }
        slides[slideIndex-1].style.display = "block";
        dots[slideIndex-1].className += " active";
        captionText.innerHTML = dots[slideIndex-1].alt;
        }
    </script>    
   
    <!-- gallery -->
    <section id="gallery" class="media">
