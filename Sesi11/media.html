<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>media = media query</title>
    <style>
        body {
            background-color: red;
            color: white;
            height: 100vh;
        }

        img {
            width: 400px;
        }

        @media print{
            body {
                background-color: white;
                color: black;
            }

            img {
                filter: grayscale(100%);
            }
        }
        @media screen and (min-width:320px) {
            h1 {
                text-align: center;
                font-size: 20px;
                text-decoration: underline;
                color: rgb(34, 11, 184);
            }

            p {
                font-size: 14px;
                padding: 0px 20px;
                line-height: 22px;
            }

            img {
                margin: auto;
                display: flex;
                width: 500px;
            }
        }
        @media screen and (min-width:500px) {
            h1 {
                color: white;
            }

            p {
                font-size: 14px;
                padding: 0px 40px;
                line-height: 25px;
            }

            img {
                margin: auto;
                display: flex;
                width: 500px;
                border: 10px solid chartreuse;
            }
        }
        @media screen and (min-width:600px) {
            h1 {
                color: black;
            }

            p {
                font-size: 14px;
                padding: 0px 40px;
                line-height: 25px;
            }

            img {
                margin: auto;
                display: flex;
                width: 500px;
                border: 10px solid chartreuse;
                border-radius: 20%;
            }
        }
        @media screen and (min-width:700px) {
            h1 {
                color: black;
            }

            p {
                font-size: 14px;
                padding: 0px 40px;
                line-height: 25px;
            }

            img {
                margin: auto;
                display: flex;
                width: 500px;
                border: 10px solid chartreuse;
                border-radius: 50%;
            }
        }
        @media (orientation: landscape) {
            body {
                background-color: brown;
            }
        }
    </style>
</head>
<body>
    <h1>arcturus is RED</h1>
    <img src="arcturus.jpeg" alt="ar">
    <p>Dark hell-themed level with a song straight out of a horror movie. Recognizable for its iconic fast-paced wave sections and 16% of the level being a black screen. Formerly an impossible level, and was part of the triple top 1 rate alongside Slaughterhouse and Firework.</p>
</body>
</html>
