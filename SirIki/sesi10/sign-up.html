<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>website sekolah - sign up</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h2>SIGN UP</h2>
        <p>Welcome to CHIS CYBER</p>

        <form>
            <!-- Name -->
            <div class="input-group">
                <label>First Name</label>
                <input type="text" required placeholder="enter firt name">
            </div>

            <div class="input-group">
                <label>Last Name</label>
                <input type="text" required placeholder="enter last name">
            </div>

            <!-- Gender -->
            <div class="input-group">
                <label>Gender</label>
                <div class="gender">
                    <p><input type="radio" name="gender">Male</p>
                    <p><input type="radio" name="gender">Female</p>
                </div>
            </div>

            <!-- Email -->
            <div class="input-group">
                <label>Email</label>
                <input type="email" required placeholder="23audrey@chis.school.com">
            </div>

            <!-- Password -->
            <div class="input-group">
                <label>Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" required placeholder="enter password">
                    <img src="./assets/hide.png" alt="showpw" class="eye-icon">
                </div>
            </div>

            <!-- Confirm Password -->
            <div class="input-group">
                <label>Re-Password</label>
                <div class="password-wrapper">
                    <input type="password" id="confirmPassword" required placeholder="enter re-password">
                    <img src="./assets/hide.png" alt="showpw" class="eye-icon">
                </div>

                <small id="errorText" style="display: none;">password not match</small>
            </div>

            <!-- Button Submit -->
            <button>Submit</button>

            <!-- Go Sign in -->
            <div class="small-text">
                Already account? <a href="./sign-in.html">Sign in here</a>
            </div>

        </form>
    </div>

    <script>
        const form = document.querySelector("form");
        const password = document.getElementById("password");
        const confirmPassword = document.getElementById("confirmPassword");
        const errorText = document.getElementById("errorText");
        const emailInput = document.querySelector('input[type="email"]');
        const eyeIcons = document.querySelectorAll(".eye-icon");

        /* =========================
           Show & Hide Password
        ========================== */
        eyeIcons.forEach((icon) => {
            icon.addEventListener("click", () => {
                const input = icon.previousElementSibling;

                if (input.type === "password") {
                    input.type = "text";
                    icon.src = "./assets/show.png";
                } else {
                    input.type = "password";
                    icon.src = "./assets/hide.png";
                }
            });
        });

        /* =========================
           Submit Validation
        ========================== */
        form.addEventListener("submit", (e) => {
            e.preventDefault();

            errorText.style.display = "none";

            /* 1. Password minimal 8 karakter */
            if (password.value.length < 8) {
                alert("Password minimal 8 karakter");
                return;
            }

            /* 2. Password harus sama */
            if (password.value !== confirmPassword.value) {
                errorText.style.display = "block";
                errorText.style.color = "red";
                return;
            }

            /* 3. Validasi email sekolah */
            if (!emailInput.value.endsWith("@chis.school.com")) {
                alert("Email harus menggunakan @chis.school.com");
                return;
            }

            /* 4. Jika semua valid */
            alert("Sign up berhasil 🎉");

            form.reset();
        });
    </script>




</body>

</html>
